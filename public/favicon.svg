<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Inner Soft Inset Highlight -->
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Modern Calculator Sizer Icon -->
  <g transform="translate(14, 12)" filter="url(#shadow)">
    <!-- Calculator Body -->
    <rect x="0" y="0" width="36" height="42" rx="6" fill="#0B132B" stroke="#A7F3D0" stroke-width="2" />
    
    <!-- LCD Screen -->
    <rect x="5" y="5" width="26" height="10" rx="3" fill="#052E16" stroke="#10B981" stroke-width="1.2" />
    <!-- Screen Digits Accent -->
    <rect x="20" y="8" width="8" height="4" rx="1" fill="#34D399" />

    <!-- Keypad Grid -->
    <!-- Row 1 -->
    <circle cx="9" cy="21" r="2.3" fill="#E2E8F0" />
    <circle cx="18" cy="21" r="2.3" fill="#E2E8F0" />
    <rect x="24" y="19" width="7" height="4.6" rx="2" fill="#0284C7" />

    <!-- Row 2 -->
    <circle cx="9" cy="28" r="2.3" fill="#E2E8F0" />
    <circle cx="18" cy="28" r="2.3" fill="#E2E8F0" />
    <rect x="24" y="26" width="7" height="4.6" rx="2" fill="#F59E0B" />

    <!-- Row 3 -->
    <circle cx="9" cy="35" r="2.3" fill="#E2E8F0" />
    <circle cx="18" cy="35" r="2.3" fill="#E2E8F0" />
    <rect x="24" y="33" width="7" height="4.6" rx="2" fill="#10B981" />
  </g>
</svg>